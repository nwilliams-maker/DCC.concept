name: Validate expanded route kiosk location
on:
  push:
    branches: [fix/expanded-route-kiosk-location-20261015]
permissions:
  contents: read
jobs:
  kiosk-location-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile DCC entrypoint and route detail view
        run: python -m py_compile tactical_workspace_master_rw.py revamp_workspace.py tests/test_expanded_kiosk_location.py
      - name: Test expanded regular route stop details, kiosk identity, and FN isolation
        run: python -m pytest -q tests/test_expanded_kiosk_location.py
