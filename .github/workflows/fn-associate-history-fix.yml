name: Validate FN Associate History Fix
on:
  push:
    branches: [fix/fn-associate-history-20261014]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FN_HISTORY_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fn-associate-history-20261014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install streamlit==1.45.1 sqlalchemy==2.0.35 pandas==2.2.3 requests==2.32.3 pytest psycopg2-binary
      - name: Apply exact Associate-only integration and compile
        run: |
          python tests/test_fn_associate_history.py --apply
          python -m py_compile revamp_workspace.py revamp_fn_history.py tactical_workspace_master_rw.py tests/test_fn_associate_history.py
      - name: Test real workspace navigation and PostgreSQL safeguards
        run: python -m pytest -q tests/test_fn_associate_history.py
      - name: Commit tested integration to fix branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revamp_workspace.py
          if ! git diff --cached --quiet; then
            git commit -m "Wire tested History into the actual FN Associate workspace only"
            git push origin HEAD:fix/fn-associate-history-20261014
          fi
