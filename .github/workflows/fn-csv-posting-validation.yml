name: Validate Field Nation CSV checkmark / Posted gate
on:
  push:
    branches: [fix/fn-csv-checkmark-posting-gate-20261014]
permissions:
  contents: read
jobs:
  fn-csv-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FN_CSV_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
      FN_HISTORY_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated dependencies
        run: python -m pip install streamlit==1.45.1 sqlalchemy==2.0.35 pandas==2.2.3 requests==2.32.3 pytest psycopg2-binary
      - name: Compile all affected Python files
        run: python -m py_compile migration/data_access.py revamp_workspace.py revamp_fn_history.py tests/test_fn_csv_posting_guard.py
      - name: Initialize disposable database
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migration/schema.sql
      - name: Test durable CSV checks, denied posts and Associate UI
        run: python -m pytest -q tests/test_fn_csv_posting_guard.py tests/test_fn_associate_history.py
