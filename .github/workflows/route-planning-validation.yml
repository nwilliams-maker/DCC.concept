name: Validate route calculation limits
on:
  push:
    branches: [fix/mapbox-route-calculation-20261014]
permissions:
  contents: read
jobs:
  route-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest
      - name: Compile routing and workspace
        run: python -m py_compile route_planning.py tactical_workspace_master_rw.py revamp_workspace.py
      - name: Exercise actual route planner, limits and continuous round trips
        run: python -m pytest -q tests/test_route_planning_api_limits.py
