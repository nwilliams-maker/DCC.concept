name: Validate FN Assign name sync (no deployment)
on:
  push:
    branches: [fix/fn-assign-name-sync-20261014]
permissions:
  contents: read
jobs:
  fn-rename-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FN_ASSIGN_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
      FN_HISTORY_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@localhost:5432/postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install streamlit==1.45.1 sqlalchemy==2.0.35 pandas==2.2.3 requests==2.32.3 pytest psycopg2-binary
      - name: Check syntax before tests
        run: python -m py_compile migration/fn_side_effects.py migration/data_access.py revamp_workspace.py tactical_workspace_master_rw.py tests/test_fn_assign_name_sync.py
      - name: Create disposable PostgreSQL schema
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f migration/schema.sql
      - name: Test verified OnFleet and DCC work-order name synchronization
        run: python -m pytest -q tests/test_fn_assign_name_sync.py tests/test_fn_associate_history.py
